meta:
  version: v3
  top_intents:
    Emotion Evocation:
      selection: multi
      hint: Punctual emotions can stack primary/secondary, but keep focus to 1-2.
    Attention Guidance:
      selection: multi
      hint: A scene may hold several attention strategies; a single shot usually one.
    Atmosphere:
      selection: multi
      hint: Pick at most one ground tone (3.1-3.9); textures (3.10/3.11) may layer.
    Viewpoint/Alignment:
      selection: single
      hint: Viewing position is unique at any instant; 4.4 alignment modulation may
        coexist with the first three.
    Characterization:
      selection: multi
      hint: Dimension + value structure; ask for the concrete value once selected.
    Pacing:
      selection: single
      hint: Fast/slow is a bipolar axis - use a slider; 6.3/6.4 are sequence-layer
        and selectable separately.
    Empathy:
      selection: multi
      hint: Intimacy / involvement / mentalizing / alliance can stack progressively.
    Information Management:
      selection: multi
      hint: 8.1 is director-given information (A); 8.2-8.4 are audience narrative
        interest (B).
    Exposition:
      selection: multi
      hint: Functional dimension; usually appears as a secondary intent.
    Spatial Representation:
      selection: multi
      hint: 10.2/10.3 are the scale bipolar axis - use a slider.
    Compositional Aesthetics:
      selection: multi
      hint: 11.1/11.2 are a bipolar axis; 11.4 is a cross-cutting attribute - use
        with care.
    Thematic Meaning:
      selection: multi
      hint: 12.2/12.3 are sequence-layer intents.
  sub_types:
    '8.1': A
    '8.2': B
    '8.3': B
    '8.4': B
  scopes:
    scene:
    - '3.1'
    - '3.2'
    - '3.3'
    - '3.4'
    - '3.5'
    - '3.6'
    - '3.7'
    - '3.8'
    - '3.9'
    - '3.10'
    - '3.11'
    sequence:
    - '6.3'
    - '6.4'
    - '12.2'
    - '12.3'
    both:
    - '6.1'
    - '6.2'
  axes:
  - id: pace-fast-slow
    poles:
    - '6.1'
    - '6.2'
    description: fast <-> slow; per shot read camera/action speed, per sequence read
      editing density
  - id: spatial-scale
    poles:
    - '10.2'
    - '10.3'
    description: two poles of scale - person made tiny <-> object made grand; often
      two faces of the same setup
  - id: composition-stability-tension
    poles:
    - '11.1'
    - '11.2'
    description: balanced stability <-> unbalanced tension
  value_sets:
    '5.1':
    - dominant
    - equal
    - submissive
    '5.2':
    - fear
    - sadness
    - anger
    - joy
    - disgust
    - awe
    - loneliness
    - anxiety
    '5.3':
    - intimate
    - opposed
    - subordinate
    - allied
    - isolated
  open_value:
  - '5.4'
  confusable_rules:
  - id: A
    between:
    - - '1'
    - - '3'
    rule: Pointing at one single moment -> Emotion (1, punctual); enveloping the whole
      scene with no pointable second -> Atmosphere (3, field). They may coexist.
    probe: Is this feeling triggered by one specific moment, or does it hang over
      the whole scene with no single second you could point to?
  - id: B
    between:
    - - '4'
    - - '7'
    rule: Adjusting the cognitive vantage / whose eyes we see from -> Viewpoint (4);
      adjusting emotional closeness / moral stance -> Empathy (7).
    probe: 'Counterfactual: if the character were someone the audience hates, would
      the effect remain? Yes -> viewpoint; gone -> empathy.'
  - id: C
    between:
    - - '5.2'
    - - '7.3'
    rule: Showing the inner psychology clearly -> 5.2; making the audience actively
      infer and invest -> 7.3.
    probe: Do you want "the audience to understand what he is thinking", or "the audience
      unable to stop guessing what he is thinking"?
  - id: D
    between:
    - - '1.2'
    - - '8.3'
    rule: Plain tension without a clear outcome -> 1.2 (affective state); anxiety
      about a specific future result -> 8.3 (informational suspense).
    probe: Is the audience simply tense, or agonizing over some concrete 'what happens
      next' outcome?
  - id: E
    between:
    - - '8.1'
    - - '9'
    rule: Uncovering a deliberately withheld truth -> 8.1; supplying environment/background
      that was simply meant to be there -> 9.
    probe: Was this piece of information deliberately withheld before?
  - id: F
    between:
    - - '8.2'
    - - '8.3'
    rule: A mystery in the past / already existing -> Curiosity (8.2); anxiety about
      a future outcome -> Suspense (8.3).
    probe: Does the audience want to know "what has already happened", or "what will
      happen next"?
  - id: G
    between:
    - - '3.5'
      - '3.6'
      - '3.7'
      - '3.8'
    - - '1.5'
    rule: A warm/cheerful ground across the whole scene -> Atmosphere (field); joy
      at one single moment -> Emotion (punctual).
    probe: Is this warmth the ground of the whole scene, or ignited at a single moment?
