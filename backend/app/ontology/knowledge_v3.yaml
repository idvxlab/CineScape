# Ontology v3 knowledge cards - one film-grammar card per sub-intent (LLM draft + human review)
#
# Knowledge anchor for pure-reasoning generation: instead of "labeled data ->
# retrieval", film-grammar priors hang directly on the leaves of the design
# space. Cards for the converged tags are injected at generation time.
#
# Fields:
#   mechanism  - the psychological/perceptual mechanism by which this intent works
#                (why the audience feels this effect)
#   techniques - the shot parameters most relevant to this intent and candidate
#                choices (only the essentials, not the full table)
#   references - classic references (to anchor concreteness for the LLM, not
#                templates to copy)

knowledge:
  '1.1':
    mechanism: Fear arises from threat perception plus a sense of uncontrollability
      - not seeing the whole (information deprivation) and felt approach (spatial
      intrusion) directly trigger the defensive response.
    techniques:
      shot_size: Extreme close-up catching the terrified face; or long shot with the
        threat flickering deep in the frame
      angle: Low angle looking up at the threat to create oppression; tilted camera
        for instability
      lighting: Low-key hard light, underlighting on the face, large shadow areas
        for the threat to hide in
      movement: Slow push-in creating approach; handheld shake transmitting physiological
        panic
      depth_of_field: Shallow depth of field leaving the out-of-focus threat unrecognizable
      rhythm: A shock beat that bursts abruptly after a long suffocating buildup
    references:
    - 'The Shining, twins corridor: symmetrical composition + slow push-in + sudden
      cut closer'
    - 'Jaws, beach dolly zoom: spatial distortion externalizing fear'
  '1.2':
    mechanism: Tension comes from sustained uncertainty and sensory strain - cramped,
      compressed visual space and rhythmic squeezing make the audience hold their
      breath physically.
    techniques:
      composition: Tight framing and foreground obstruction compressing breathing
        room
      movement: Subtle handheld sway, body-hugging follow shots
      rhythm: Denser cutting with shrinking shot lengths; or the reverse - a single
        shot stretched out into ordeal
      lighting: Flickering or unstable light sources
      duration: Dwelling on what has not happened yet, past the comfort zone
    references:
    - The Bourne films, handheld tight-framed fights
    - Whiplash, rehearsal-room rapid cuts and sweat-bead close-ups
  '1.3':
    mechanism: Disgust is triggered by close direct looking at a repellent object;
      the nearer the distance and the clearer the tactile detail, the stronger it
      becomes. Moral disgust works through unvarnished, clinical presentation.
    techniques:
      shot_size: Extreme close-up staring straight at the repellent object or its
        detail
      focal_length: Close-range shooting magnifying material texture
      lighting: Sickly green-yellow cast; flat light leaving no room for beautification
      color_tone: Dirty low saturation, or deliberately uncomfortable high saturation
      duration: No cutaway; forcing the gaze to stay
    references:
    - Oldboy (2003), the long take of eating live octopus
    - Parasite, close-ups of the smell details
  '1.4':
    mechanism: Sadness needs temporal and spatial breathing room for the emotion to
      settle - slow pacing, cold color, and the figure's separation from the environment
      guide empathic deflation.
    techniques:
      shot_size: Medium/close shots watching silence, or long shots isolating the
        figure in emptiness
      movement: Static long take or extremely slow movement
      color_tone: Low-saturation cold blue-gray
      lighting: Overcast diffused light; window light from the side or behind
      duration: Holding longer than the narrative requires, giving the emotion time
        to linger
    references:
    - Manchester by the Sea, cold-toned static frames
    - Tokyo Story, quiet observation from a low camera
  '1.5':
    mechanism: Positive emotion is evoked by open space, warm high-key color, and
      fluid motion - the felt freedom of movement maps directly onto psychological
      lightness.
    techniques:
      lighting: High-key natural light, direct sunlight
      color_tone: Warm yellow, high saturation
      movement: Smooth crane rises, orbits, and run-alongs
      rhythm: Brisk, in step with music-driven cutting
      shot_size: Alternating open-space wide shots and close-ups of smiling faces
    references:
    - La La Land, the opening freeway song-and-dance
    - Kikujiro, cycling through green fields
  '1.6':
    mechanism: Anger is ignited by unflinching confrontation and adversarial composition
      - head-on conflict axes, aggressive movement, and hard cuts push the audience
      into an oppositional stance.
    techniques:
      angle: Frontal direct gaze; axis-facing standoff
      movement: Sudden pushes, whip pans, aggressive handheld
      rhythm: Hard cuts, fast cross-cutting between opponents
      lighting: High-contrast hard light
      composition: Symmetric standoff or oppressive imbalance
    references:
    - Raging Bull, closing in on the ring
    - Joker, the subway outburst sequence
  '1.7':
    mechanism: Awe comes from scale beyond measure - the extreme proportional contrast
      between a human and a colossal object, slow solemn revealing movements, and
      low angles let the audience experience being transcended.
    techniques:
      shot_size: Extreme long shot rendering the extreme scale contrast
      angle: Low angle on the colossal object
      movement: Slow, solemn rise or reveal
      focal_length: Wide angle accentuating mass
      duration: Long take letting the audience look their fill
      lighting: Divine backlight, volumetric light
    references:
    - '2001: A Space Odyssey, low-angle shots of the monolith'
    - Dune, the sandworm reveal; Interstellar, the giant wave
  '2.1':
    mechanism: The eye is drawn by contrast - any one of focus, brightness, color,
      or motion contrast can pin the gaze to the target.
    techniques:
      depth_of_field: Shallow depth of field stripping the subject from its environment
      lighting: Lighting ratio making the subject brighter than its surroundings
      composition: Centered composition or converging leading lines
      shot_size: Cut-in close-up that simply magnifies
      movement: Push-in closing on the target
    references:
    - The Godfather, the slow push-in on Bonasera in the opening
    - Notorious, the crane descent to the key extreme close-up
  '2.2':
    mechanism: The gaze travels along motion, bands of light, and compositional lines
      - choreographing what is seen first and next is editing within a single frame.
    techniques:
      composition: Leading lines and light/dark gradients paving the gaze path
      movement: Pans and tracks carrying the gaze; character blocking handing it off
        in relay
      lighting: Light zones lighting up in sequence to guide the order of scanning
      depth_of_field: Rack focus forcing the point of attention to switch
    references:
    - Touch of Evil, the bomb-to-character gaze relay in the opening long take
    - Roma (2018), deep-space staging within the widescreen frame
  '2.3':
    mechanism: 'Secondary information is retired by stripping its contrast - defocus,
      shadow, marginalization, occlusion: the audience''s not seeing is a designed
      result.'
    techniques:
      depth_of_field: Blurring secondary elements out of focus
      lighting: Pushing secondary information into shadow
      composition: Pushed to the frame edge or hidden behind foreground elements
      color_tone: Low-saturation, grayed background
    references:
    - The Godfather, low-key lighting hiding faces in shadow
    - Parasite, the previous housekeeper in the vignetted darkness
  '2.4':
    mechanism: Within a single shot, attention passes from A to B through rack focus,
      movement relay, or the abruptness of a new element entering the frame.
    techniques:
      depth_of_field: Rack focus from A to B
      movement: Pan or track carrying from A to B; following an object as it changes
        hands
      composition: B enters the frame abruptly from foreground or background
    references:
    - Se7en, rack focus from the conversation to a detail behind
    - The baton-relay principle in long-take staging
  '3.1':
    mechanism: Sustained oppression is maintained by steady rather than eruptive means
      - low-key light, lowered spaces, and slow framing keep the threat suspended,
      never released.
    techniques:
      lighting: Low key, large shadow masses, cold overhead light
      composition: Low ceilings; doors and windows as second frames
      color_tone: Desaturated cold green-iron gray
      movement: Extremely slow, stalking movement
      rhythm: The whole scene held down, refusing release
    references:
    - Se7en, the rain-soaked low-key look throughout
    - Dune, looming ceilings pressing down in the great halls
  '3.2':
    mechanism: A destabilized visual grammar keeps breaking vestibular expectations
      - tilted horizons, irregular motion, and spatial distortion make the audience
      lose their footing.
    techniques:
      angle: Dutch angles as an ongoing norm
      movement: Drifting, rotating, irregular handheld
      focal_length: Wide-angle distortion or dolly zoom
      composition: Persistently breaking horizontals and verticals
    references:
    - Vertigo, the stairwell dolly zoom
    - Black Swan, rotating body-hugging handheld
  '3.3':
    mechanism: 'An all-over depressive baseline relies on environmental means: a constant
      cold-gray tonal palette, damp rainy texture, and sluggish rhythm, pointed at
      no single event.'
    techniques:
      color_tone: Cold blue-gray, held at constant low saturation
      lighting: Overcast diffusion, no direct light
      rhythm: Uniformly sluggish pacing
      composition: Empty shots and negative space; figures kept small in the frame
    references:
    - Manchester by the Sea
    - Tarkovsky's Nostalghia, fog-and-rain long takes
  '3.4':
    mechanism: Alienation comes from an institutionalized viewing distance - distant
      observation, occlusion, and symmetric austere spaces geometrize people and keep
      the audience outside their emotions.
    techniques:
      shot_size: Mostly medium and long shots; close-ups refused
      composition: Symmetric geometrization; figures embedded in architecture
      movement: Calm lateral tracking or a fixed camera
      color_tone: Cold tone or bleached
      lighting: Flat, cold light
    references:
    - The Shining, symmetric empty shots of the hotel
    - Antonioni's L'Avventura; Roy Andersson's static medium-long shots
  '3.5':
    mechanism: An intimate baseline is continuously supplied by warm light, proximity,
      and soft texture - the audience is wrapped into the characters' safe space.
    techniques:
      lighting: Warm practical sources (lamps, firelight, sunset), soft light
      color_tone: Warm yellow-orange, creamy grade
      shot_size: Medium/close group shots; characters sharing the frame
      depth_of_field: Soft-focus shallow depth of field
      movement: Gentle, unhurried following
    references:
    - Little Forest, hearth fire and meals
    - Call Me by Your Name, summer afternoons
  '3.6':
    mechanism: Lyricism works through a beautifying filter beyond the everyday - backlight,
      soft focus, slow motion, and musicalized movement lift the moment out of real
      time.
    techniques:
      lighting: Magic-hour light, backlit silhouettes
      movement: Orbiting two-shots, slow crane rises and falls
      rhythm: Slow motion
      depth_of_field: Shallow focus and bokeh
      color_tone: Warm golden-pink grade
    references:
    - In the Mood for Love, slow-motion passing-by accompanied by strings
    - La La Land, the planetarium duet
  '3.7':
    mechanism: A light atmosphere is a combination of high-key lighting, bright color,
      and skipping rhythm - visual weight deliberately lightened.
    techniques:
      lighting: High key, no heavy shadows
      color_tone: Bright, saturated, candy colors
      rhythm: Brisk, music-driven editing
      movement: Playful lateral tracks and quick pans
      composition: Flat, graphic playfulness
    references:
    - The Grand Budapest Hotel
    - Amelie, a saturated Paris
  '3.8':
    mechanism: Tranquility is conveyed by stability and order - fixed camera, balanced
      composition, natural light, and the breathing quality of long takes.
    techniques:
      movement: Static long takes or a near-still camera
      composition: Steady horizontals, balanced framing
      lighting: Soft natural light
      rhythm: Slow and even
      duration: Long takes letting time flow naturally
    references:
    - Ozu's tatami-height fixed camera
    - Perfect Days, morning-light daily routine
  '3.9':
    mechanism: An unreal texture comes from a mild breach of physical rules - floating
      movement, unmotivated light and color, variable time, and focus with softened
      boundaries.
    techniques:
      movement: Floating Steadicam, reverse motion
      lighting: Unmotivated colored light (pink-violet neon)
      color_tone: Heavily stylized
      depth_of_field: Hazed soft focus
      rhythm: Speed changes (slow motion, jumpy ramping)
    references:
    - Mulholland Drive, the nightclub's blue light
    - Blade Runner 2049, Las Vegas orange haze
  '3.10':
    mechanism: Immersion equals a close viewpoint plus extended duration plus spatial
      continuity - unbroken by cuts, the audience shares the character's time and
      space.
    techniques:
      movement: Long-take follow shots, walking right behind the character
      duration: Extended takes
      shot_size: Close-in medium shots that keep spatial context
      depth_of_field: Natural deep focus
    references:
    - Children of Men, the car-ambush long take
    - 1917, filmed as one continuous take
  '3.11':
    mechanism: A documentary texture relies on traces of relinquished control - visible
      handheld, natural light, imperfect framing, and reactive following suggest the
      event exists before the camera.
    techniques:
      movement: Handheld following, frantic pans hunting for focus
      lighting: All-natural available light
      composition: Unpolished; tolerating incidental obstruction
      color_tone: Neutral, ungraded look
    references:
    - 4 Months, 3 Weeks and 2 Days, the static dinner long take
    - The Dardenne brothers, close-behind handheld
  '4.1':
    mechanism: When the camera position coincides with the character's eye position,
      the audience is forced to process information in the first person - the suture
      of POV and reaction shots produces identification.
    techniques:
      angle: Character eyeline height; POV subjective shots
      movement: Motion synced to the character's head movement
      shot_size: POV alternating with reaction close-ups to suture
      depth_of_field: Focus simulating the human attention of the eye
    references:
    - Rear Window, the window-POV system
    - Son of Saul, shallow-focus face-hugging tracking
  '4.2':
    mechanism: A camera that belongs to no character, with restrained movement, places
      the audience in the position of a witness and returns emotional judgment to
      them.
    techniques:
      angle: Eye level, coinciding with no character's eyeline
      shot_size: Mostly medium and long shots
      movement: Static or restrained lateral moves
      composition: Theatrical full-scene staging
    references:
    - Haneke's Hidden (Cache), surveillance-style static shots
    - Hou Hsiao-hsien's long-take distant observation
  '4.3':
    mechanism: A high vantage above any single character and cross-space movement
      grant the audience an information position the characters do not have.
    techniques:
      angle: High angle, top-down overhead
      movement: Rises lifting away from the figures; crane or aerial moves crossing
        space
      shot_size: Extreme long shots with people like chess pieces
    references:
    - The Godfather, omniscient cross-cutting in the baptism montage
    - Citizen Kane, the descent through the skylight
  '4.4':
    mechanism: The allocation of shot resources - who owns the close-ups, who owns
      the POVs, who occupies frame center - quietly distributes the audience's sympathy
      and allegiance.
    techniques:
      shot_size: More and closer looks at the favored character
      angle: Over-shoulder bias matched to eyelines
      lighting: More sculpted light on the favored character
      composition: Placement between center and edge
    references:
    - The Silence of the Lambs, Hannibal's frontal close-up looking into the lens
    - Psycho, the quiet mid-film shift of viewpoint
  '5.1':
    mechanism: Dominance relations are translated directly into spatial grammar -
      height difference, share of the frame, and stability - and the audience reads
      strength and weakness from bodily experience.
    techniques:
      angle: Low angle for the dominant, high angle for the dominated
      shot_size: The dominant figure fills more of the frame
      composition: High center versus low edge
      lighting: Sculpted light on the dominant face, flat light on the weak
      movement: The camera organized around the dominant figure
    references:
    - Citizen Kane, low-angle shots from a low camera
    - Parasite, vertical power up and down the stairs
  '5.2':
    mechanism: Inner states are externalized into readable signals through facial
      micro-expression close-ups, gaze direction, and subjectivized audiovisual treatment
      - focus, light, and color shifting with the psychology.
    techniques:
      shot_size: Facial close-ups and extreme close-ups
      duration: Holding on the reaction
      lighting: Psychologized light (shadow dividing the face)
      depth_of_field: Defocus expressing a dazed state
      movement: Slow push-in moving into the interior
    references:
    - The Godfather, the close-up of Michael's eyes before the killing
    - Dreyer's The Passion of Joan of Arc, the faces
  '5.3':
    mechanism: 'A relationship is geometry within the frame - distance, separators,
      shared frame or not, eyeline connection: composition is the topographic map
      of the relationship.'
    techniques:
      composition: Shared or split framing, foreground barriers separating, symmetric
        standoff
      shot_size: Choosing between two-shots and single shots
      depth_of_field: Same focal plane signals alliance; fore/background separation
        signals estrangement
      movement: The camera sewing the two together or cutting them apart
    references:
    - In the Mood for Love, separation by walls and doorframes
    - Marriage Story, opening shared frames breaking into separate frames
  '5.4':
    mechanism: The visual rhetoric of a character's entrance - environment, props,
      lighting style, and manner of movement - completes the statement of identity
      before any line of dialogue.
    techniques:
      composition: Figures embedded in attribute environments (workspace, carried
        objects)
      lighting: Character-specific lighting styles (hard side light for toughness,
        high key for innocence)
      movement: Manner of entrance (slow reveal or sudden intrusion)
      shot_size: Detail close-ups of hands and objects speaking for identity
    references:
    - Pulp Fiction, the suited walk down the corridor
    - Once Upon a Time in the West, the Harmonica man's entrance
  '6.1':
    mechanism: Shrinking shot lengths plus intensifying movement accelerate the information
      flow, dragging the audience's heart rate upward.
    techniques:
      rhythm: Denser cutting, shot lengths shrinking
      movement: Fast pushes, pulls, pans, and tilts; chase handheld
      duration: Stacked short shots
      shot_size: Wider jumps between shot sizes
    references:
    - The Bourne films, rapid-cut fights
    - 'Mad Max: Fury Road, the chases'
  '6.2':
    mechanism: Extended duration plus slow motion or stillness makes time viscous
      - the audience is forced to sit with the image while emotion settles or tension
      accumulates.
    techniques:
      duration: Long takes exceeding expectation
      movement: Static or slowly creeping
      rhythm: Slow motion, delayed cuts
      composition: Static compositions made for staring
    references:
    - Tarkovsky's Stalker, the long takes in the water
    - No Country for Old Men, the silence of the motel standoff
  '6.3':
    mechanism: Time spans are compressed into perceptible sequences of visual change
      - dissolves, empty shots, shifts of light and season, and match cuts.
    techniques:
      rhythm: Dissolve montages, jump-cut sequences
      lighting: Day/night light transitions
      composition: Repeated same-camera comparisons
      movement: Time-lapse
    references:
    - Citizen Kane, the breakfast-table montage
    - '2001: A Space Odyssey, the bone-to-spaceship match cut'
  '6.4':
    mechanism: The pacing envelope of a sequence (tight-loose-tight) is designed as
      an emotional curve the audience breathes along with the editing; deceleration
      before the climax is loading the spring.
    techniques:
      rhythm: Segment-level acceleration-pause-burst design
      duration: Deliberate lengthening before the key shot
      movement: Movement energy rising and falling with the emotional curve
    references:
    - Whiplash, the tension-and-release architecture of the final solo
    - Inception, multi-layer time cross-cutting ramping up the pressure
  '7.1':
    mechanism: Shortened physical distance is translated into psychological closeness
      - near framing, eye-level gaze height, and soft light simulate the bodily experience
      of intimacy.
    techniques:
      shot_size: Holding at close-shot distance
      angle: Eye-level gaze height
      lighting: Soft light, catchlights
      movement: Handheld with a subtle breathing feel
      depth_of_field: Shallow focus isolating a world of two
    references:
    - Before Sunrise, close-framed conversation
    - Moonlight, shallow focus on the beach
  '7.2':
    mechanism: Resonance comes from experiencing with the character rather than watching
      from outside - following movement, reaction shots privileged over the action
      itself, and enough duration for the emotion to ferment.
    techniques:
      movement: Tracking alongside, walking with the character
      shot_size: Reaction close-ups privileged over the action itself
      duration: Dwelling on the emotion
      rhythm: Rising and falling with the character's inner rhythm
    references:
    - Son of Saul, glued behind the protagonist throughout
    - Manchester by the Sea, the police-station breakdown long take
  '7.3':
    mechanism: Deliberate information gaps (behavior without explanation) plus held
      faces force the audience to actively model the character's mind - investment
      deepens as inference grows.
    techniques:
      shot_size: Long facial close-ups that refuse answers
      duration: Extended holds opening space for interpretation
      composition: Backs and obstructions keeping the mystery
      movement: Quiet observation without intervention
    references:
    - Toni Erdmann, the final long take on the face
    - Kelly Reichardt's restrained held faces
  '7.4':
    mechanism: The visibility of suffering and the asymmetrical rendering of harm
      steer moral alignment - shot allocation to the vulnerable party makes the audience
      care.
    techniques:
      angle: Eye level for the victim; rhetorically arranged angles for the perpetrator
      shot_size: Close-ups of suffering detail
      lighting: Rembrandt light on the victim's face
      duration: A gaze that does not look away
    references:
    - Schindler's List, the girl in red
    - Capernaum, eye-level tracking of Zain
  '8.1':
    mechanism: 'Delivering truth visually requires a ritual of revelation - movement
      uncovering obstruction, rack focus, pulling back to expose the whole: timing
      is meaning.'
    techniques:
      movement: Pan or pull-back reveal
      depth_of_field: Rack focus onto what was previously hidden
      shot_size: Pulling back from close-up to wide to expose context
      composition: Designing and then removing obstructing elements
    references:
    - The Truman Show, the pull-back revealing the studio
    - The Invisible Guest, the reassembled flashback at the end
  '8.2':
    mechanism: 'Information that exists but is withheld is presented incompletely
      to provoke inquiry - fragments, partial close-ups, off-screen hints: the question
      lies in the past.'
    techniques:
      shot_size: Partial details only, never the full picture
      composition: Key objects at the frame edge or in soft focus
      lighting: Half-revealing shadow
      movement: Moves that start to reveal and then stop
    references:
    - Citizen Kane, the film-long withholding of Rosebud
    - Vertigo, the close-up of the spiral hairdo
  '8.3':
    mechanism: 'The Hitchcock bomb principle - the audience knows what the character
      does not: an information gap plus temporal delay equals dread. Shots keep confirming
      the coexistence of threat and ignorance.'
    techniques:
      composition: Threat and the ignorant character in one frame (deep focus, foreground
        and background)
      rhythm: Cross-cutting the threat with the everyday
      duration: Stretching the time before it happens
      movement: Slow push toward the threat source
    references:
    - Hitchcock's bomb-under-the-table theory
    - Inglourious Basterds, the basement-bar scene
  '8.4':
    mechanism: Surprise is the instant collapse of the expectation model - prior setup
      pushes the audience toward a wrong prediction, then the reveal arrives by the
      shortest path (hard cut, sudden entry into frame).
    techniques:
      rhythm: Hard-cut rupture
      composition: Off-screen space suddenly entering the frame
      movement: Sudden eruption after stillness
      shot_size: Instant jump to a much wider shot
    references:
    - Psycho, the shower
    - Oldboy, the twist of the truth reveal
  '9.1':
    mechanism: The establishing shot fixes the space-time coordinates at maximum information
      density - landmarks, the time of day carried by light, and period signifiers
      delivered at once.
    techniques:
      shot_size: Extreme long shot for establishing
      movement: Slow pan or aerial scan
      lighting: Morning/evening light fixing the time
      composition: Landmarks and period signifiers in frame
    references:
    - Blade Runner, the opening night view of Los Angeles
    - Once Upon a Time in the West, the station establishing shot
  '9.2':
    mechanism: The audience needs a cognitive map to read the action - the wide shot
      establishes relative positions, and cuts that respect the axis keep the map
      intact.
    techniques:
      shot_size: Master wide shot laying the base
      composition: Maintaining the axis; eyeline matching
      movement: Staging that clarifies spatial relations
    references:
    - Seven Samurai, spatial clarity in the village defense
    - The classic master-coverage shooting system
  '9.3':
    mechanism: Background information is embedded in frame elements (newspapers, televisions,
      signs, set dressing) or in foreground action, avoiding exposition by dialogue.
    techniques:
      composition: Information props placed naturally in frame
      depth_of_field: Keeping background information legible
      movement: The camera sweeping past information elements
      shot_size: Cut-in close-ups of key objects
    references:
    - Children of Men, background TV news building the world
    - Roma (2018), street details as period information
  '10.1':
    mechanism: The figure's share of the frame and its blending with or opposition
      to the environment - embedded in texture versus separated by contour - states
      its condition and belonging.
    techniques:
      shot_size: Wide and long shots keeping the environment present
      composition: Ratio and placement of figure versus environment
      focal_length: Wide angle including the environment; telephoto stripping it away
      depth_of_field: Environment in focus means present; blurred means absent
    references:
    - Revolutionary Road, the figure at the window versus the suburban house
    - Paris, Texas, the person and the desert
  '10.2':
    mechanism: Extreme scale contrast and engulfing negative space reduce the figure
      to a scale reference - the audience experiences existential smallness.
    techniques:
      shot_size: Figures like specks in extreme long shots
      composition: Large areas of negative space; the figure pushed into a corner
      angle: Crushing high angles
      focal_length: Wide angle inflating the scale of space
    references:
    - Dune, humans against megastructures
    - Blade Runner 2049, K walking into the colossal ruins
  '10.3':
    mechanism: Monumentality needs a frame of reference and a rhythm of revelation
      - measuring against a human or a known object, the camera slowly unfolds the
      scale and leaves the audience time to gauge it.
    techniques:
      movement: Slow pan or crane rise measuring the colossal object
      composition: Known-scale objects as reference
      angle: Low angles extending upward
      duration: Long takes granting enough time to gauge
      shot_size: Progression from detail to the whole
    references:
    - '2001: A Space Odyssey, the space-station waltz'
    - The Lord of the Rings, the sweeping wide shots of Helm's Deep
  '10.4':
    mechanism: Distance between figures, their connecting lines, and barriers are
      the spatial language of relationships - staging that changes the distance changes
      the relationship.
    techniques:
      composition: Gaps, foreground barriers, split framing
      focal_length: Telephoto compressing the two together; wide angle exaggerating
        the rift
      movement: Blocking that alters distance
      depth_of_field: Foreground/background separation for estrangement
    references:
    - In the Mood for Love, passing each other in the narrow alley
    - The Social Network, the telephoto standoff across the conference table
  '11.1':
    mechanism: Symmetry, horizontals, and geometric order satisfy the perceptual expectation
      of Gestalt closure, conveying control and calm - and can ironically suggest
      rigidity.
    techniques:
      composition: Symmetry, strictly applied rule of thirds, leveled horizontals
      angle: Frontal, eye level
      movement: Static or precisely tracked moves
      focal_length: Normal focal length, no distortion
    references:
    - Wes Anderson's centered symmetry
    - Kubrick's one-point perspective
  '11.2':
    mechanism: Breaking Gestalt expectations (tilts, truncation, incompleteness, misplaced
      negative space) generates visual energy - the audience's perceptual system keeps
      wanting to correct it.
    techniques:
      composition: Unbalanced weighting, head-cutting compositions, edge pressure
      angle: Dutch angles
      movement: Irregular movement
      focal_length: Wide-angle distortion
    references:
    - The Bourne films, unstable framings
    - The Big Short, deliberately wrong crash zooms
  '11.3':
    mechanism: The frame's own graphic pleasure - color echoes, pattern repetition,
      geometric coincidences - supplies gratification independently of the narrative.
    techniques:
      composition: Graphic compositions, color-block echoes
      color_tone: Overall palette designed as a whole
      lighting: Light-and-shadow patterns (blinds, silhouettes)
      focal_length: Telephoto flattening into pattern
    references:
    - The Grand Budapest Hotel, the confectionary palette
    - Hero, color-coded segments
  '11.4':
    mechanism: Formal choices held steady across scenes - fixed focal length, camera
      height, palette, movement grammar - accumulate into a recognizable authorial
      signature that governs the whole film.
    techniques:
      composition: A composition rule applied across the film
      movement: Unified movement grammar (e.g., a self-imposed push-ins-only, no pulls
        rule)
      color_tone: Palette discipline across the film
      angle: Signature camera positions
    references:
    - Ozu's 50mm lens and tatami-height camera
    - Roy Andersson's locked-off wide shots; Wes Anderson's complete rulebook
  '12.1':
    mechanism: A concrete object gains a second meaning through compositional emphasis
      and contextual juxtaposition - metaphor intensity equals visual emphasis times
      repetition times narrative timing.
    techniques:
      composition: Prominent placement and juxtaposition of the symbol
      shot_size: Cut-in close-up assigning meaning
      lighting: Symbolic light and shadow (cross shapes, cage shadows)
      movement: Deliberate holds or revisits
    references:
    - The Godfather, oranges as omens of death
    - Parasite, the stone and the stairs
  '12.2':
    mechanism: The systematic return of a single image, color, or composition builds
      a semantic network across the film - each recurrence carries accumulated and
      varied meaning.
    techniques:
      color_tone: Running a motif color through the film with variations
      composition: Revisiting repeated compositions
      shot_size: Repeated shot sizes forming visual rhymes
      lighting: Repeated lighting patterns
    references:
    - Schindler's List, the color red
    - 'Kieslowski''s Three Colours: Blue; Citizen Kane''s snow globe'
  '12.3':
    mechanism: 'Segment-level switches in visual parameters - palette, aspect ratio,
      texture, movement grammar - act as chapter punctuation: the audience knows a
      new chapter has begun without any title card.'
    techniques:
      color_tone: Palette switch per segment
      lighting: Tonal contrast across segments
      composition: Change of aspect ratio
      movement: Movement-grammar switches between segments (handheld to locked-off)
    references:
    - The Grand Budapest Hotel, three aspect ratios
    - Moonlight, three chapters in three colors
