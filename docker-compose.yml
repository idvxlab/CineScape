version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cinedesign-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinedesign
      POSTGRES_USER: cinedesign
      POSTGRES_PASSWORD: cinedesign_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinedesign -d cinedesign"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cinedesign-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cinedesign.dev
      PGADMIN_DEFAULT_PASSWORD: admin_dev
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
