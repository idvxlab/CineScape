# 本体 v3 知识卡 — 每个二级意图一张电影语法卡片(LLM 初稿 + 人工审校)
#
# 这是纯推理生成的知识锚点:替代"标注数据→检索召回",把电影语法先验
# 直接挂在设计空间的叶子上。生成时按收敛 tags 注入对应卡片。
#
# 字段:
#   mechanism  — 该意图起作用的心理/知觉机制(为什么观众会产生这个效果)
#   techniques — 十参数中与该意图强相关的参数及候选手法(只列要害,非全表)
#   references — 经典参照(供 LLM 锚定具体性,不是要复制的模板)

knowledge:
  "1.1":
    mechanism: 恐惧源于威胁知觉加不可控感——看不全(信息剥夺)与逼近感(空间侵入)直接触发防御反应。
    techniques:
      shot_size: 大特写捕捉惊恐面部;或远景让威胁在画面深处若隐若现
      angle: 低角度仰拍威胁制造压迫;倾斜机位制造失稳
      lighting: 低调硬光、底光照脸、大面积阴影供威胁藏匿
      movement: 缓慢推近制造逼近感;手持抖动传染生理恐慌
      depth_of_field: 浅景深让焦外威胁不可辨认
      rhythm: 长时间压抑后骤然爆发的惊吓节拍
    references:
      - 《闪灵》双胞胎走廊:对称构图+缓推+突然切近
      - 《大白鲨》海滩 dolly zoom:空间畸变外化恐惧

  "1.2":
    mechanism: 紧张来自持续的不确定与感官紧绷——视觉空间的拥挤压缩与节奏挤压让观众生理性屏息。
    techniques:
      composition: 紧框、前景遮挡压缩呼吸空间
      movement: 手持微晃、贴身跟拍
      rhythm: 剪辑加密、镜头时长递减;或反向用单镜拖长制造煎熬
      lighting: 闪烁或不稳定光源
      duration: 在"还没发生"上停留超出舒适区
    references:
      - 《谍影重重》手持紧框打斗
      - 《爆裂鼓手》排练室快切与汗珠特写

  "1.3":
    mechanism: 厌恶由排斥物的近距直视触发,距离越近、细节质感越清晰越强;道德性厌恶靠不加美化的冷静呈现。
    techniques:
      shot_size: 大特写直视排斥物或细节
      focal_length: 近摄放大材质质感
      lighting: 病态绿黄色调、平光不留美化余地
      color_tone: 污浊低饱和,或令人不适的高饱和
      duration: 不剪开、强迫观看
    references:
      - 《老男孩》生吃章鱼长镜
      - 《寄生虫》"气味"细节特写

  "1.4":
    mechanism: 悲伤需要时间与空间的留白让情绪沉降——慢节奏、冷色与人物-环境的分离感引导共鸣性低落。
    techniques:
      shot_size: 中近景注视沉默,或远景将人物孤立于空旷
      movement: 静止长镜或极缓移动
      color_tone: 低饱和冷蓝灰
      lighting: 阴天散射光、窗光侧逆
      duration: 超出叙事必需的停留,给情绪滞留时间
    references:
      - 《海边的曼彻斯特》冷色静框
      - 《东京物语》低机位静观

  "1.5":
    mechanism: 正向情绪由开放空间、暖色高调与流畅运动唤起——运动的自由感直接映射心理的轻盈。
    techniques:
      lighting: 高调自然光、日光直晒
      color_tone: 暖黄高饱和
      movement: 流畅升降环绕、跟随奔跑
      rhythm: 轻快,与音乐性剪辑配合
      shot_size: 开放空间全景与笑脸近景交替
    references:
      - 《爱乐之城》开场高速公路歌舞
      - 《菊次郎的夏天》绿野骑行

  "1.6":
    mechanism: 愤怒被不公的直视与对抗性构图点燃——正面冲突轴线、攻击性运动和硬切把观众推入对抗位。
    techniques:
      angle: 正面直视、轴线对峙
      movement: 急推、甩镜、攻击性手持
      rhythm: 硬切、快节奏对切
      lighting: 高对比硬光
      composition: 对称对峙或压迫性失衡
    references:
      - 《愤怒的公牛》拳台逼近
      - 《小丑》地铁爆发段落

  "1.7":
    mechanism: 敬畏来自尺度的不可丈量——人与巨物的极端比例差、缓慢庄严的揭示运动与仰视角令观众体验"被超越"。
    techniques:
      shot_size: 大远景呈现极端比例
      angle: 仰拍巨物
      movement: 缓慢庄严的上升或揭示
      focal_length: 广角强化体量
      duration: 长镜让观众"看够"
      lighting: 神性逆光、体积光
    references:
      - 《2001太空漫游》黑石仰拍
      - 《沙丘》沙虫揭示;《星际穿越》巨浪

  "2.1":
    mechanism: 视线被对比吸引——焦点、亮度、色彩、运动四种对比任一可把注视钉在目标上。
    techniques:
      depth_of_field: 浅景深把主体从环境中剥离
      lighting: 主体亮于环境的光比引导
      composition: 中心构图或引导线汇聚
      shot_size: 切入特写直接放大
      movement: 推镜逼近目标
    references:
      - 《教父》开场缓推 Bonasera
      - 《美人计》钥匙大特写的吊臂下降

  "2.2":
    mechanism: 视线沿运动、光带与构图线移动——安排"先看哪、后看哪"等于在单帧内做剪辑。
    techniques:
      composition: 引导线、明暗梯度铺设视线路径
      movement: 摇移带视线、角色走位接力
      lighting: 光区依次点亮引导扫视顺序
      depth_of_field: 焦点拉移强制切换注视点
    references:
      - 《历劫佳人》开场长镜的炸弹-人物视线接力
      - 《罗马》全景内的纵深调度

  "2.3":
    mechanism: 通过剥夺对比让次要信息退场——失焦、暗部、边缘化、遮挡;观众"看不见"是设计出来的。
    techniques:
      depth_of_field: 焦外虚化次要元素
      lighting: 把次要信息压入暗部
      composition: 推至画框边缘或被前景遮挡
      color_tone: 低饱和灰化背景
    references:
      - 《教父》暗部藏脸的低调布光
      - 《寄生虫》画面暗角中的前管家

  "2.4":
    mechanism: 单镜内注意从 A 交接到 B,靠焦点转移、运动接力或新元素入画的突然性完成。
    techniques:
      depth_of_field: 焦点从 A 拉到 B
      movement: 摇移从 A 带到 B、跟随物件转手
      composition: B 从前景或背景突然入画
    references:
      - 《七宗罪》焦点从对话拉到背后细节
      - 长镜调度中的"接力棒"原则

  "3.1":
    mechanism: 持续低气压靠稳定而非爆发的手段维持——低调光、压低的空间、缓慢取景让威胁"悬而不发"。
    techniques:
      lighting: 低调、大面积阴影、冷峻顶光
      composition: 低天花板、门窗框二次框取
      color_tone: 脱饱和的冷绿铁灰
      movement: 极缓的潜行式移动
      rhythm: 全场压着不放,拒绝释放
    references:
      - 《七宗罪》全片雨夜低调
      - 《沙丘》厅堂压顶构图

  "3.2":
    mechanism: 失衡的视觉语法持续打破前庭预期——倾斜地平线、不规则运动、空间畸变让观众"站不稳"。
    techniques:
      angle: 倾斜机位常态化
      movement: 漂浮、旋转、不规则手持
      focal_length: 广角畸变或 dolly zoom
      composition: 持续打破水平与垂直
    references:
      - 《迷魂记》楼梯 dolly zoom
      - 《黑天鹅》贴身旋转手持

  "3.3":
    mechanism: 全场低落底色靠环境性手段:恒定的冷灰影调、阴雨质感与缓滞节奏,不指向单一事件。
    techniques:
      color_tone: 冷蓝灰、低饱和恒定
      lighting: 阴天散射、无直射光
      rhythm: 全场缓滞
      composition: 空镜与留白,人物在画面中偏小
    references:
      - 《海边的曼彻斯特》
      - 塔可夫斯基《乡愁》雾雨长镜

  "3.4":
    mechanism: 疏离感来自观看距离的制度化——远观、遮挡、对称冷峻的空间把人物几何化,观众被挡在情感之外。
    techniques:
      shot_size: 中远景为主、拒绝特写
      composition: 对称几何化、人物嵌入建筑结构
      movement: 冷静的轨道平移或固定
      color_tone: 冷调或漂白
      lighting: 平冷光
    references:
      - 《闪灵》酒店对称空镜
      - 安东尼奥尼《奇遇》;罗伊·安德森固定中远景

  "3.5":
    mechanism: 亲密底色由暖光、近距与柔质感持续供给——观众被"包进"人物的安全空间。
    techniques:
      lighting: 暖色实用光源(台灯炉火夕阳)、柔光
      color_tone: 暖黄橙、奶油调
      shot_size: 中近景群像、人物共享画框
      depth_of_field: 柔焦浅景深
      movement: 轻缓跟随
    references:
      - 《小森林》灶火饭食
      - 《请以你的名字呼唤我》夏日午后

  "3.6":
    mechanism: 抒情靠"超日常"的美化滤镜——逆光、柔焦、慢动作与音乐化运动把时刻从现实时间里抬起。
    techniques:
      lighting: 黄昏魔幻时刻、逆光轮廓
      movement: 环绕双人、缓慢升降
      rhythm: 慢动作
      depth_of_field: 浅焦光斑
      color_tone: 金粉暖调
    references:
      - 《花样年华》慢动作擦肩配弦乐
      - 《爱乐之城》天文台双人舞

  "3.7":
    mechanism: 轻快氛围是高调照明、明快色彩与跳跃节奏的组合——视觉重量被刻意调轻。
    techniques:
      lighting: 高调、无沉重阴影
      color_tone: 明快高饱和、糖果色
      rhythm: 轻快剪辑、音乐驱动
      movement: 活泼的横移与快速摇镜
      composition: 平面化的图形趣味
    references:
      - 《布达佩斯大饭店》
      - 《天使爱美丽》高饱和巴黎

  "3.8":
    mechanism: 安详由稳定与秩序传达——固定机位、均衡构图、自然光与长镜呼吸感。
    techniques:
      movement: 固定长镜或极缓
      composition: 水平线稳定、均衡
      lighting: 柔和自然光
      rhythm: 缓慢均匀
      duration: 长镜头让时间自然流淌
    references:
      - 小津安二郎榻榻米固定机位
      - 《完美的日子》晨光日常

  "3.9":
    mechanism: 非现实质感来自物理规则的轻度破坏——漂浮运动、非理据光色、时间变速与边界模糊的焦点。
    techniques:
      movement: 漂浮斯坦尼康、倒放
      lighting: 非理据色光(粉紫霓虹)
      color_tone: 高度风格化
      depth_of_field: 雾化柔焦
      rhythm: 变速(慢动作、跳跃)
    references:
      - 《穆赫兰道》夜店蓝光
      - 《银翼杀手2049》拉斯维加斯橙雾

  "3.10":
    mechanism: 身临其境感等于视点贴近加长时值加空间连续性——不被剪辑打断,观众与角色共享时空。
    techniques:
      movement: 长镜跟拍、贴背行进
      duration: 超长镜头
      shot_size: 中景贴近同时保持空间感
      depth_of_field: 自然全焦
    references:
      - 《人类之子》车内突袭长镜
      - 《1917》一镜到底

  "3.11":
    mechanism: 纪实质感靠"放弃控制"的痕迹——可见的手持、自然光、不完美构图与被动跟拍,暗示事件先于摄影机存在。
    techniques:
      movement: 手持跟拍、急摇找焦点
      lighting: 全自然光、现场光
      composition: 不修饰、容忍偶发遮挡
      color_tone: 中性、无调色感
    references:
      - 《四月三周两天》晚餐固定长镜
      - 达内兄弟贴背手持

  "4.1":
    mechanism: 观看位置与角色眼位重合时,观众被迫以第一人称处理信息——POV 与反应镜头的缝合产生代入。
    techniques:
      angle: 角色视线高度、POV 主观镜头
      movement: 与角色头部运动同步
      shot_size: POV 与反应特写交替缝合
      depth_of_field: 模拟人眼的注意焦点
    references:
      - 《后窗》窗口 POV 体系
      - 《索尔之子》浅焦贴脸跟拍

  "4.2":
    mechanism: 不属于任何角色的机位加克制的运动,把观众放在"目击者"位置,情感判断交还观众。
    techniques:
      angle: 平视、不与任何角色视线重合
      shot_size: 中远景为主
      movement: 固定或克制平移
      composition: 舞台式全景调度
    references:
      - 哈内克《隐藏摄像机》监控式固定
      - 侯孝贤长镜远观

  "4.3":
    mechanism: 超越任一角色的高位俯瞰与跨空间运动,授予观众角色不具备的信息位置。
    techniques:
      angle: 大俯拍、正俯视
      movement: 上升脱离人物、跨越空间的升降航拍
      shot_size: 大远景中人如棋子
    references:
      - 《教父》洗礼蒙太奇的全知交叉
      - 《公民凯恩》穿越天窗下降

  "4.4":
    mechanism: 镜头资源的分配(谁拥有特写、谁拥有 POV、谁占画框中心)悄悄分配观众的亲近与立场。
    techniques:
      shot_size: 给目标角色更多、更近的注视
      angle: 视线匹配的过肩偏向
      lighting: 目标角色的光更立体
      composition: 中心与边缘的位置分配
    references:
      - 《沉默的羔羊》汉尼拔直视镜头的正面特写
      - 《惊魂记》中段视点的悄然转移

  "5.1":
    mechanism: 支配关系被空间语法直译——高度差、画面占比与稳定度,观众用身体经验读出强弱。
    techniques:
      angle: 仰拍强者、俯拍弱者
      shot_size: 强者占据更大画幅
      composition: 高位中心对低位边缘
      lighting: 强者面光立体、弱者扁平
      movement: 镜头围绕强者组织
    references:
      - 《公民凯恩》低机位仰拍
      - 《寄生虫》楼梯上下的垂直权力

  "5.2":
    mechanism: 内心状态经面部微表情特写、视线方向与主观化视听(焦点光色随心理变化)外化为可读信号。
    techniques:
      shot_size: 面部特写、大特写
      duration: 在反应上停留
      lighting: 心理化光影(阴影分割面孔)
      depth_of_field: 失焦表达恍惚
      movement: 缓推进入内心
    references:
      - 《教父》迈克尔刺杀前的眼神特写
      - 德莱叶《圣女贞德受难记》的面孔

  "5.3":
    mechanism: 关系是画框内的几何——距离、分隔物、共框与否、视线连接;构图是关系的地形图。
    techniques:
      composition: 共框分框、前景障碍分隔、对称对峙
      shot_size: 双人景别与单人切分的选择
      depth_of_field: 同焦平面表同盟,前后景分离表隔阂
      movement: 镜头把两人"缝"在一起或切开
    references:
      - 《花样年华》墙与门框的分隔
      - 《婚姻故事》开场共框到分框

  "5.4":
    mechanism: 角色登场的视觉修辞——环境、道具、光型与运动方式——在台词之前完成身份陈述。
    techniques:
      composition: 人物嵌入其属性环境(职业空间、随身物件)
      lighting: 性格化光型(硬汉侧光、纯真高调)
      movement: 登场方式(缓慢揭示或突然闯入)
      shot_size: 手部、物件等细节特写代言身份
    references:
      - 《低俗小说》西装走廊
      - 《西部往事》口琴人登场

  "6.1":
    mechanism: 镜头时长递减加运动加剧造成信息流提速,观众心率被拖着上行。
    techniques:
      rhythm: 剪辑加密、镜头时长递减
      movement: 快速推拉摇移、追身手持
      duration: 短镜头堆叠
      shot_size: 景别跳变幅度加大
    references:
      - 《谍影重重》打斗快切
      - 《疯狂的麦克斯4》追逐

  "6.2":
    mechanism: 超长时值加慢动作或静止让时间黏稠化——观众被迫与画面"对坐",情绪沉降或张力积聚。
    techniques:
      duration: 长镜头超出预期
      movement: 固定或缓慢蠕动
      rhythm: 慢动作、延迟剪辑
      composition: 静态构图供凝视
    references:
      - 塔可夫斯基《潜行者》水中长镜
      - 《老无所依》旅馆对峙的静默

  "6.3":
    mechanism: 时间跨度被压缩为可感知的视觉变化序列——叠化、空镜、光线季节变化与匹配剪辑。
    techniques:
      rhythm: 叠化蒙太奇、跳切序列
      lighting: 日夜光线推移
      composition: 同机位重复对比
